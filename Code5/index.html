<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparativa Centrada - Documento Optimizado vs Desordenado</title>
  <style>
    /* Estilos generales */
    body {
      background-color: #121214;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px;
      box-sizing: border-box;
      font-family: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
      text-align: center;
    }

    /* Contenedor principal centrado */
    .comparison-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* Sección individual con título y ventana de código */
    .section-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 12px;
    }

    /* Títulos de sección centrados */
    .section-title {
      color: #e1e1e6;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-align: center;
      width: 100%;
    }

    /* Ventana tipo terminal alineada a la izquierda en su interior, pero centrada globalmente */
    .code-window {
      background-color: #1e1e24;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    /* Barra superior de la ventana */
    .window-header {
      background-color: #18181c;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .close { background-color: #ff5f56; }
    .minimize { background-color: #ffbd2e; }
    .maximize { background-color: #27c93f; }

    .window-filename {
      color: #7a7a8c;
      font-size: 13px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Área donde se escribe el código */
    .code-body {
      padding: 24px 28px;
      color: #d4d4d4;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      text-align: left;
      min-height: 90px;
    }

    /* Paleta de colores (JSON Syntax Highlighting) */
    .token-key    { color: #9cdcfe; }                     /* Claves de los objetos JSON */
    .token-string { color: #ce9178; }                     /* Cadenas de texto */
    .token-number { color: #b5cea8; }                     /* Valores numéricos */

    /* Cursor parpadeante fino (estilo editor) */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background-color: #ffffff;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="comparison-container">
    
    <!-- Sección 1: Documento optimizado -->
    <div class="section-group">
      <div class="section-title">Documento optimizado:</div>
      <div class="code-window">
        <div class="window-header">
          <span class="btn-circle close"></span>
          <span class="btn-circle minimize"></span>
          <span class="btn-circle maximize"></span>
          <span class="window-filename">documento_optimizado.json</span>
        </div>
        <div class="code-body"><span id="code-content-1"></span><span class="cursor" id="cursor-1"></span></div>
      </div>
    </div>

    <!-- Sección 2: Documento desordenado -->
    <div class="section-group">
      <div class="section-title">Documento desordenado:</div>
      <div class="code-window">
        <div class="window-header">
          <span class="btn-circle close"></span>
          <span class="btn-circle minimize"></span>
          <span class="btn-circle maximize"></span>
          <span class="window-filename">documento_desordenado.json</span>
        </div>
        <div class="code-body"><span id="code-content-2"></span><span class="cursor" id="cursor-2" style="display: none;"></span></div>
      </div>
    </div>

  </div>

  <script>
    // Tokens para el primer bloque (Documento optimizado)
    const tokens1 = [
      { text: "{\n  " },
      { text: '"cliente_id"', class: "token-key" },
      { text: ": " },
      { text: "1001", class: "token-number" },
      { text: ",\n  " },
      { text: '"nombre"', class: "token-key" },
      { text: ": " },
      { text: '"Ana"', class: "token-string" },
      { text: ",\n  " },
      { text: '"ciudad"', class: "token-key" },
      { text: ": " },
      { text: '"Bogotá"', class: "token-string" },
      { text: "\n}" }
    ];

    // Tokens para el segundo bloque (Documento desordenado)
    const tokens2 = [
      { text: "{\n  " },
      { text: '"data1"', class: "token-key" },
      { text: ": " },
      { text: '"..."', class: "token-string" },
      { text: ",\n  " },
      { text: '"campoX"', class: "token-key" },
      { text: ": " },
      { text: '"..."', class: "token-string" },
      { text: ",\n  " },
      { text: '"otro"', class: "token-key" },
      { text: ": " },
      { text: '"..."', class: "token-string" },
      { text: "\n}" }
    ];

    const container1 = document.getElementById("code-content-1");
    const container2 = document.getElementById("code-content-2");
    const cursor1 = document.getElementById("cursor-1");
    const cursor2 = document.getElementById("cursor-2");

    let tIndex1 = 0, cIndex1 = 0, el1 = null;
    let tIndex2 = 0, cIndex2 = 0, el2 = null;

    // Animación secuencial: primero escribe el bloque 1, luego el bloque 2
    function typeBlock1() {
      if (tIndex1 < tokens1.length) {
        const token = tokens1[tIndex1];
        if (cIndex1 === 0) {
          if (token.class) {
            el1 = document.createElement("span");
            el1.className = token.class;
            container1.appendChild(el1);
          } else {
            el1 = document.createTextNode("");
            container1.appendChild(el1);
          }
        }

        const char = token.text.charAt(cIndex1);
        if (token.class) {
          el1.textContent += char;
        } else {
          el1.nodeValue += char;
        }

        cIndex1++;
        if (cIndex1 === token.text.length) {
          cIndex1 = 0;
          tIndex1++;
        }
        setTimeout(typeBlock1, 20);
      } else {
        cursor1.style.display = "none";
        cursor2.style.display = "inline-block";
        setTimeout(typeBlock2, 300);
      }
    }

    function typeBlock2() {
      if (tIndex2 < tokens2.length) {
        const token = tokens2[tIndex2];
        if (cIndex2 === 0) {
          if (token.class) {
            el2 = document.createElement("span");
            el2.className = token.class;
            container2.appendChild(el2);
          } else {
            el2 = document.createTextNode("");
            container2.appendChild(el2);
          }
        }

        const char = token.text.charAt(cIndex2);
        if (token.class) {
          el2.textContent += char;
        } else {
          el2.nodeValue += char;
        }

        cIndex2++;
        if (cIndex2 === token.text.length) {
          cIndex2 = 0;
          tIndex2++;
        }
        setTimeout(typeBlock2, 20);
      }
    }

    setTimeout(typeBlock1, 500);
  </script>

</body>
</html>
